  <body data-barba="wrapper">
    <div class="loading-screen">

        <h2>Frederick</h2>

    <nav class="nav">

      <img data-for="paiva" src="/media/paiva-lat.jpg" alt="" />

        <p class="label">Vamos trabalhar juntos</p>
